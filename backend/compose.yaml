services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aspio
      POSTGRES_USER: aspio
      POSTGRES_PASSWORD: aspio
    ports:
      - "55432:5432"
    volumes:
      - aspio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspio -d aspio"]
      interval: 3s
      timeout: 3s
      retries: 20

  upload-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data/uploads && chown -R 65532:65532 /data/uploads && chmod 0750 /data/uploads"]
    volumes:
      - aspio_uploads:/data/uploads
    restart: "no"

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://aspio:aspio@postgres:5432/aspio?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTO_MIGRATE: "true"
      UPLOAD_DIR: /data/uploads
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      upload-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - aspio_uploads:/data/uploads

volumes:
  aspio_postgres:
  aspio_uploads:
